# Build the docs on main and publish them with GitHub Pages.
# Copy to .github/workflows/publish-pages.yml; set Settings > Pages > Source
# to "GitHub Actions". It never runs for pull requests, so a fork cannot publish.
name: publish docs

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: zenmd
        uses: zenmark-org/zenmd@v0.8.0
        with:
          folder: docs
          output: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.zenmd.outputs.output }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
