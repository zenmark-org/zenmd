# Settings for this site. Edit freely: zen reads this file again when it changes.
# The page layout and the page template rules (templates:) are added below
# when the site is made.
version: 1

plugins:
  codeblock: true
  diagram: { theme: neutral }

# zenmd export site (or File › Export › Website) writes the website to exports/html.

layout: docs

# Pages in these folders follow a page template (.zen/templates).
templates:
  "getting-started/**": tutorial
  "how-tos/**": how-to
  "explanation/**": explanation
  "reference/**": reference
  "releases/**": release-notes
  "glossary/**": term
