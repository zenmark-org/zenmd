id: glossary
version: 0.1.0
description: A-Z index built from the term pages of a folder
template: layout.html
css: [glossary.css]
js: [glossary.js]
help:
  summary: "The index of a glossary, for glossary/index.md. It is built from the term pages beside it (pages whose layout is term), so the file holds only its frontmatter and an optional intro. It shows the count, a letter bar (A to Z and #) that stays on top while scrolling, the terms in alphabetical order grouped by letter, each with its abbreviation, aliases and definition, and a filter field. Left and right keys move along the letter bar, Enter jumps. Esc clears the filter."
  snippets:
    - title: A glossary index
      markdown: "---\ntitle: Glossary\nlayout: glossary\n---\nThe words this guide uses.\n"
