id: release-notes
name: Release notes
description: "What changed in one release: Added, Changed, Fixed. The version is the title"
version: 1.1.0
layout: release
fields:
  version: { type: string, required: true }                       # semver, such as 1.2.0; the page's title
  date:    { type: date, required: true, default: "{{today}}" }
  name:    { type: string }                                       # optional, shown under the version
skeleton: |
  ## Added

  - A new thing

  ## Changed

  - A thing that works differently now

  ## Fixed

  - A bug that is gone
